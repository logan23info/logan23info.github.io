baseURL = "https://logan23info.github.io/"
languageCode = "en-us"
title = "Security Engineering Wiki"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description         = "A practitioner's reference for Security Engineering — Threat Modelling, OWASP, Cloud, Detection, AI/LLM, Cryptography, Privacy, Compliance, Incident Response, and OT/ICS."
  author              = "Logan"
  defaultTheme        = "auto"
  ShowReadingTime     = true
  ShowCodeCopyButtons = true
  ShowToc             = true
  TocOpen             = false
  ShowBreadCrumbs     = true
  ShowPostNavLinks    = true
  ShowShareButtons    = false
  ShowWordCount       = true
  ShowFullTextinRSS   = true
  disableScrollToTop  = false
  comments            = false
  hidemeta            = false
  ShowAllPagesInArchive = true
  mainSections        = ["posts"]

[params.homeInfoParams]
  Title   = "🛡️ Security Engineering Wiki"
  Content = """
A practitioner's reference covering the full security engineering lifecycle — over 85 pages of working code, templates, and checklists.

**Foundations** (threat modelling, red/purple teaming, zero trust) · **OWASP Top 10** · **Secure Architecture** · **Cloud Security** (AWS/GCP/Azure) · **Detection Engineering** · **AI & LLM Security** · **Cryptography** · **Privacy** · **Compliance** (GDPR/PCI/ISO/SOC2/DORA) · **Incident Response** · **OT/ICS Security** · **Security Metrics**.

Start at the **[Wiki index](/wiki/)** to navigate by topic or role.
"""

[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/logan23info"

[[params.socialIcons]]
  name = "rss"
  url  = "/index.xml"

[taxonomies]
  tag      = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name   = "Posts"
    url    = "/posts/"
    weight = 10
  [[menu.main]]
    name   = "Wiki"
    url    = "/wiki/"
    weight = 20
  [[menu.main]]
    name   = "OWASP"
    url    = "/wiki/owasp-top10/"
    weight = 30
  [[menu.main]]
    name   = "Cloud"
    url    = "/wiki/cloud-security/"
    weight = 40
  [[menu.main]]
    name   = "Detection"
    url    = "/wiki/detection-engineering/"
    weight = 50
  [[menu.main]]
    name   = "AI Security"
    url    = "/wiki/ai-security/"
    weight = 60
  [[menu.main]]
    name   = "Crypto"
    url    = "/wiki/crypto/"
    weight = 70
  [[menu.main]]
    name   = "Compliance"
    url    = "/wiki/compliance/"
    weight = 80
  [[menu.main]]
    name   = "IR"
    url    = "/wiki/incident-response/"
    weight = 90
  [[menu.main]]
    name   = "OT/ICS"
    url    = "/wiki/ot-ics/"
    weight = 100
  [[menu.main]]
    name   = "Tags"
    url    = "/tags/"
    weight = 110

[markup]
  [markup.highlight]
    noClasses = false
    style     = "monokai"
    lineNos   = false
    tabWidth  = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
