baseURL = "https://logan23info.github.io/"
languageCode = "en-us"
title = "Security Engineering Wiki"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description         = "A practitioner's reference for Security Engineering — Threat Modelling, OWASP, Cloud, Detection, AI/LLM, Cryptography, Privacy, Compliance, Incident Response, and OT/ICS."
  author              = "Logan"
  defaultTheme        = "auto"
  ShowReadingTime     = true
  ShowCodeCopyButtons = true
  ShowToc             = true
  TocOpen             = false
  ShowBreadCrumbs     = true
  ShowPostNavLinks    = true
  ShowShareButtons    = false
  ShowWordCount       = true
  ShowFullTextinRSS   = true
  disableScrollToTop  = false
  comments            = false
  hidemeta            = false
  ShowAllPagesInArchive = true
  mainSections        = ["posts"]

[params.profileMode]
  enabled     = true
  title       = "🛡️ Security Engineering Wiki"
  subtitle    = "A practitioner's reference covering the full security engineering lifecycle — over 90 pages of working code, templates, and checklists."
  imageUrl    = ""
  imageWidth  = 120
  imageHeight = 120
  buttons = [
    { name = "Threat Modelling", url = "/threat-modelling/" },
    { name = "OWASP Top 10", url = "/wiki/owasp-top10/" },
    { name = "Cloud Security", url = "/wiki/cloud-security/" },
    { name = "Detection Eng", url = "/wiki/detection-engineering/" },
    { name = "AI & LLM Security", url = "/wiki/ai-security/" },
    { name = "Full Wiki Index", url = "/wiki/" },
  ]

[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/logan23info"

[[params.socialIcons]]
  name = "rss"
  url  = "/index.xml"

[taxonomies]
  tag      = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name    = "Posts"
    url     = "/posts/"
    pageRef = "/posts/"
    weight  = 10
  [[menu.main]]
    name    = "Wiki"
    url     = "/wiki/"
    pageRef = "/wiki/"
    weight  = 20
  [[menu.main]]
    name    = "Threat Modelling Guide"
    url     = "/threat-modelling/"
    pageRef = "/threat-modelling/"
    weight  = 25
  [[menu.main]]
    name    = "OWASP Top 10"
    url     = "/wiki/owasp-top10/"
    pageRef = "/wiki/owasp-top10/"
    weight  = 30
  [[menu.main]]
    name    = "Cloud"
    url     = "/wiki/cloud-security/"
    pageRef = "/wiki/cloud-security/"
    weight  = 40
  [[menu.main]]
    name    = "SOC & Detection"
    url     = "/wiki/detection-engineering/"
    pageRef = "/wiki/detection-engineering/"
    weight  = 50
  [[menu.main]]
    name    = "AI/LLM"
    url     = "/wiki/ai-security/"
    pageRef = "/wiki/ai-security/"
    weight  = 60
  [[menu.main]]
    name    = "Crypto"
    url     = "/wiki/crypto/"
    pageRef = "/wiki/crypto/"
    weight  = 70
  [[menu.main]]
    name    = "Compliance Mappings"
    url     = "/wiki/compliance/"
    pageRef = "/wiki/compliance/"
    weight  = 80
  [[menu.main]]
    name    = "IR Playbooks"
    url     = "/wiki/incident-response/"
    pageRef = "/wiki/incident-response/"
    weight  = 90
  [[menu.main]]
    name    = "OT & ICS Security"
    url     = "/wiki/ot-ics/"
    pageRef = "/wiki/ot-ics/"
    weight  = 100
  [[menu.main]]
    name    = "Tags"
    url     = "/tags/"
    pageRef = "/tags/"
    weight  = 110

[markup]
  [markup.highlight]
    noClasses = false
    style     = "monokai"
    lineNos   = false
    tabWidth  = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
