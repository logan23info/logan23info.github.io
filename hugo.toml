baseURL = "https://logan23info.github.io/"
languageCode = "en-us"
title = "Security Engineering Wiki"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description         = "A practitioner's reference for Security Engineering — Threat Modelling, OWASP, Cloud, Detection, AI/LLM, Cryptography, Privacy, Compliance, Incident Response, and OT/ICS."
  author              = "Logan"
  defaultTheme        = "auto"
  ShowReadingTime     = true
  ShowCodeCopyButtons = true
  ShowToc             = true
  TocOpen             = false
  ShowBreadCrumbs     = true
  ShowPostNavLinks    = true
  ShowShareButtons    = false
  ShowWordCount       = true
  ShowFullTextinRSS   = true
  disableScrollToTop  = false
  comments            = false
  hidemeta            = false
  ShowAllPagesInArchive = true
  mainSections        = []

[params.homeInfoParams]
  Title   = "🛡️ Security Engineering Wiki"
  Content = """
A practitioner's reference covering the full security engineering lifecycle — over 90 pages of working code, templates, and checklists across 14 domains.

<div class="references-section">

## 🧭 How to read this wiki — 4 steps

<div class="ref-grid">
  <a class="ref-card" href="/threat-modelling/"><span class="ref-label">Step 1</span>Start with Threat Modelling — understand what can go wrong before you build</a>
  <a class="ref-card" href="/wiki/"><span class="ref-label">Step 2</span>Pick your domain from the Wiki index — 14 areas, browse by role or topic</a>
  <a class="ref-card" href="/wiki/landscape/"><span class="ref-label">Step 3</span>See the Landscape page — how every domain connects across the lifecycle</a>
  <a class="ref-card" href="/wiki/advisory-assurance/"><span class="ref-label">Step 4</span>Validate with Advisory & Assurance — turn controls into evidence</a>
</div>

</div>

<div class="references-section">

## 🚀 Jump straight to a domain

<div class="ref-grid">
  <a class="ref-card" href="/wiki/owasp-top10/"><span class="ref-label">AppSec</span>OWASP Top 10 — the 10 most critical web vulnerabilities, with code fixes and detection methods for each</a>
  <a class="ref-card" href="/wiki/secure-architecture/"><span class="ref-label">Design</span>Secure Architecture — microservices, API, secrets, container, and Kubernetes security patterns</a>
  <a class="ref-card" href="/wiki/cloud-security/"><span class="ref-label">Cloud</span>Cloud Security — hardening baselines for AWS, GCP, and Azure plus a misconfiguration top 10</a>
  <a class="ref-card" href="/wiki/detection-engineering/"><span class="ref-label">SOC</span>Detection Engineering — SIEM use cases, Sigma rules, alert tuning, and SOC playbooks</a>
  <a class="ref-card" href="/wiki/ai-security/"><span class="ref-label">AI</span>AI & LLM Security — prompt injection, OWASP LLM Top 10, and AI-specific threat modelling</a>
  <a class="ref-card" href="/wiki/crypto/"><span class="ref-label">Crypto</span>Cryptography — fundamentals, PKI, TLS, key management, and post-quantum readiness</a>
  <a class="ref-card" href="/wiki/privacy/"><span class="ref-label">Privacy</span>Privacy & Data Protection — GDPR engineering, DPIAs, and data subject rights in code</a>
  <a class="ref-card" href="/wiki/compliance/"><span class="ref-label">Compliance</span>Compliance Mappings — GDPR, PCI-DSS, ISO 27001, SOC 2, and DORA translated for engineers</a>
  <a class="ref-card" href="/wiki/incident-response/"><span class="ref-label">IR</span>Incident Response — ransomware, data breach, and DDoS playbooks plus post-incident reviews</a>
  <a class="ref-card" href="/wiki/ot-ics/"><span class="ref-label">OT/ICS</span>OT & ICS Security — the Purdue model, ICS threat modelling, and MITRE ATT&CK for ICS</a>
  <a class="ref-card" href="/wiki/metrics/"><span class="ref-label">Metrics</span>Security Metrics & KPIs — what to measure, board reporting, and risk appetite frameworks</a>
  <a class="ref-card" href="/wiki/maturity-ladder/"><span class="ref-label">Foundations</span>Maturity Ladder — the full progression from threat modelling to Zero Trust</a>
</div>

</div>

<div class="references-section">

## 🧰 DevOps RCM — a companion tool

A **Risk Control Matrix** generator for DevOps and platform teams — map controls to risks quickly and export a ready-to-use RCM. Useful alongside the [Advisory & Assurance](/wiki/advisory-assurance/) section on this wiki when you need to formalise controls into evidence.

<div class="ref-grid">
  <a class="ref-card" href="https://devopsrcm.vercel.app/" target="_blank" rel="noopener"><span class="ref-label">Tool</span>DevOps RCM — Risk Control Matrix Generator ↗</a>
</div>

</div>

**Reading by role?** Developer, Security Engineer, Auditor, SOC Analyst, AI/ML Engineer, and OT/ICS paths are on the **[Wiki index](/wiki/)**. **Latest posts?** See [/posts/](/posts/).
"""

