baseURL = "https://logan23info.github.io/"
languageCode = "en-us"
title = "Security Engineering Wiki"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description         = "Security Engineering Maturity — Threat Modelling, ASM, Red Teaming, Purple Teaming, Threat Intelligence, Zero Trust, Supply Chain Security"
  author              = "Logan"
  defaultTheme        = "auto"
  ShowReadingTime     = true
  ShowCodeCopyButtons = true
  ShowToc             = true
  TocOpen             = false
  ShowBreadCrumbs     = true
  ShowPostNavLinks    = true
  ShowShareButtons    = false
  ShowWordCount       = true
  ShowFullTextinRSS   = true
  disableScrollToTop  = false
  comments            = false
  hidemeta            = false
  disableSpecial1stPost = false
  disableAnchoredHeadings = false
  ShowAllPagesInArchive = true
  mainSections        = ["posts"]

[params.homeInfoParams]
  Title   = "🛡️ Security Engineering Wiki"
  Content = """
A practitioner's reference covering the **Security Engineering Maturity Ladder** — \
from Threat Modelling foundations through Attack Surface Management, Red Teaming, \
Purple Teaming, Threat Intelligence, Zero Trust Architecture, and Supply Chain Security. \
All content is practitioner-focused — real techniques, real trade-offs, working code.
"""

[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/logan23info"

[[params.socialIcons]]
  name = "rss"
  url  = "/index.xml"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[menu]
  [[menu.main]]
    name       = "Posts"
    url        = "/posts/"
    weight     = 1
  [[menu.main]]
    name       = "Wiki"
    url        = "/wiki/"
    weight     = 2
  [[menu.main]]
    name       = "🪜 Maturity Ladder"
    url        = "/wiki/maturity-ladder/"
    weight     = 3
  [[menu.main]]
    name       = "Tags"
    url        = "/tags/"
    weight     = 4
  [[menu.main]]
    name       = "About"
    url        = "/about/"
    weight     = 5

[markup]
  [markup.highlight]
    noClasses  = false
    style      = "monokai"
    lineNos    = false
    tabWidth   = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
