[markup]
  [markup.highlight]
    noClasses = false
    style     = "monokai"
    lineNos   = false
    tabWidth  = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
