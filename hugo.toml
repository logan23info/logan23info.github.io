baseURL = "https://logan23info.github.io/"
languageCode = "en-us"
title = "Security Engineering Wiki"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description         = "A practitioner's reference for Security Engineering — Threat Modelling, OWASP, Cloud, Detection, AI/LLM, Cryptography, Privacy, Compliance, Incident Response, and OT/ICS."
  author              = "Logan"
  defaultTheme        = "auto"
  ShowReadingTime     = true
  ShowCodeCopyButtons = true
  ShowToc             = true
  TocOpen             = false
  ShowBreadCrumbs     = true
  ShowPostNavLinks    = true
  ShowShareButtons    = false
  ShowWordCount       = true
  ShowFullTextinRSS   = true
  disableScrollToTop  = false
  comments            = false
  hidemeta            = false
  ShowAllPagesInArchive = true
  mainSections        = ["posts"]

[params.homeInfoParams]
  Title   = "🛡️ Security Engineering Wiki"
  Content = """
A practitioner's reference covering the full security engineering lifecycle — over 90 pages of working code, templates, and checklists.

**Start here:** [Threat Modelling](/threat-modelling/) · [OWASP Top 10](/wiki/owasp-top10/) · [Cloud Security](/wiki/cloud-security/) · [Detection Engineering](/wiki/detection-engineering/) · [AI & LLM Security](/wiki/ai-security/) · [Incident Response](/wiki/incident-response/)

Want the full picture first? See the **[Security Engineering Landscape](/wiki/landscape/)** — a map of how every domain connects. Or browse everything from the **[Wiki index](/wiki/)**.
"""

[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/logan23info"

[[params.socialIcons]]
  name = "rss"
  url  = "/index.xml"

[taxonomies]
  tag      = "tags"
  category = "categories"

