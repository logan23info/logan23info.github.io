baseURL = "https://logan23info.github.io/"
languageCode = "en-us"
title = "Security Engineering Wiki"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description         = "A practitioner's reference for Security Engineering — Threat Modelling, OWASP, Secure Architecture, Red Teaming, Zero Trust, Advisory & Assurance"
  author              = "Logan"
  defaultTheme        = "auto"
  ShowReadingTime     = true
  ShowCodeCopyButtons = true
  ShowToc             = true
  TocOpen             = false
  ShowBreadCrumbs     = true
  ShowPostNavLinks    = true
  ShowShareButtons    = false
  ShowWordCount       = true
  ShowFullTextinRSS   = true
  disableScrollToTop  = false
  comments            = false
  hidemeta            = false
  disableSpecial1stPost = false
  disableAnchoredHeadings = false
  ShowAllPagesInArchive = true
  mainSections        = ["posts"]

[params.homeInfoParams]
  Title   = "🛡️ Security Engineering Wiki"
  Content = """
A practitioner's reference covering the full security engineering lifecycle — \
**Threat Modelling**, **OWASP Top 10**, **Secure Architecture**, **Red & Purple Teaming**, \
**Threat Intelligence**, **Zero Trust**, **Supply Chain Security**, and **Advisory & Assurance**. \
Real techniques, working code, evidence templates.
"""

[[params.socialIcons]]
  name = "github"
  url  = "https://github.com/logan23info"

[[params.socialIcons]]
  name = "rss"
  url  = "/index.xml"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[menu]
  [[menu.main]]
    name       = "Posts"
    url        = "/posts/"
    weight     = 10

  [[menu.main]]
    name       = "Wiki"
    url        = "/wiki/"
    weight     = 20

  [[menu.main]]
    name       = "🪜 Maturity Ladder"
    url        = "/wiki/maturity-ladder/"
    weight     = 30

  [[menu.main]]
    name       = "OWASP Top 10"
    url        = "/wiki/owasp-top10/"
    weight     = 40

  [[menu.main]]
    name       = "Secure Architecture"
    url        = "/wiki/secure-architecture/"
    weight     = 50

  [[menu.main]]
    name       = "Assurance"
    url        = "/wiki/advisory-assurance/"
    weight     = 60

  [[menu.main]]
    name       = "Tags"
    url        = "/tags/"
    weight     = 70

  [[menu.main]]
    name       = "About"
    url        = "/about/"
    weight     = 80

[markup]
  [markup.highlight]
    noClasses  = false
    style      = "monokai"
    lineNos    = false
    tabWidth   = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
